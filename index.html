<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon planning course</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Course">
<meta name="theme-color" content="#13203A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2540" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#13203A; --muted:#64728A; --line:#E0E5EC; --line-strong:#CBD3DE;
  --hero:#13203A; --hero-ink:#FFFFFF; --hero-muted:#A9B5C9; --hero-lane:rgba(255,255,255,.13);
  --run:#E8590C; --run-soft:#FDEBDF; --renfo:#0F8F7E; --renfo-soft:#DDF3EF; --rest:#A3AEBD;
  --gold:#C08F00; --gold-soft:#FFF3C9; --hero-gold:#F5C842; --today:#FFF6F0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1320; --surface:#172034; --ink:#E9EEF6; --muted:#93A0B5; --line:#243049; --line-strong:#33405C;
    --hero:#1A2540; --hero-lane:rgba(255,255,255,.1);
    --run:#FF8A4C; --run-soft:#3F2618; --renfo:#3CC7B2; --renfo-soft:#143936; --rest:#5E6A7E;
    --gold:#F2C94C; --gold-soft:#352D12; --today:#221E22;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1320; --surface:#172034; --ink:#E9EEF6; --muted:#93A0B5; --line:#243049; --line-strong:#33405C;
  --hero:#1A2540; --hero-lane:rgba(255,255,255,.1);
  --run:#FF8A4C; --run-soft:#3F2618; --renfo:#3CC7B2; --renfo-soft:#143936; --rest:#5E6A7E;
  --gold:#F2C94C; --gold-soft:#352D12; --today:#221E22;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:10}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 32px}

/* Bandeau : le seul élément fort de la page, aux couleurs de l’icône */
.hero{background:var(--hero);color:var(--hero-ink);margin:0 -14px;padding:14px 18px 16px;border-radius:0 0 22px 22px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 14px}
.range{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2.5rem;line-height:.95;letter-spacing:-.005em;margin:0}
.sub{color:var(--hero-muted);font-size:.95rem;margin:6px 0 0}
.nav{display:flex;gap:8px;padding-top:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--hero-ink);display:grid;place-items:center;font-size:1.35rem;line-height:1;padding:0 0 2px}
.icon-btn:active{background:rgba(255,255,255,.2)}

/* La piste : une ligne par séance */
.track{display:flex;gap:5px;margin:0 0 9px}
.track span{flex:1;height:12px;border-radius:6px;background:var(--hero-lane);transition:background .3s}
.track span.run.ok{background:var(--run)}
.track span.renfo.ok{background:var(--renfo)}
.track.perfect span,.track.perfect span.ok{background:var(--hero-gold)}
.stats{display:flex;justify-content:space-between;color:var(--hero-muted);font-size:.92rem;margin:0}
.stats b{color:var(--hero-ink);font-weight:600;font-size:1.05rem}
.gold-txt b{color:var(--hero-gold)}
.note{color:var(--hero-muted);font-size:.92rem;margin:0}

/* Onglets */
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;margin:14px 0 12px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tabs::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--hero);transition:transform .28s cubic-bezier(.3,.7,.3,1)}
.tabs[data-active="month"]::before{transform:translateX(100%)}
.tabs[data-active="badges"]::before{transform:translateX(200%)}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:600;font-size:.92rem;white-space:nowrap;color:var(--muted);transition:color .2s}
.tabs button[aria-pressed="true"]{color:var(--hero-ink)}
.tabs button[aria-pressed="false"]:active{color:var(--ink)}

/* Semaine */
.week{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.week.gold{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.day{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.today{background:var(--today);box-shadow:inset 4px 0 0 var(--run)}
.day-head{flex:none;width:70px;display:flex;flex-direction:column;justify-content:center;padding:8px 0 8px 14px}
.day-name{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.35rem;line-height:1.05}
.day.today .day-name{color:var(--run)}
.day-date{color:var(--muted);font-size:.82rem;line-height:1.2}
.day-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.rest{color:var(--rest);font-size:.9rem;font-style:italic;padding:10px 6px}
.sess{display:flex;align-items:center;gap:10px;padding:6px 6px}
.sess + .sess{border-top:1px dashed var(--line)}
.plus{flex:none;width:40px;border:0;background:none;color:var(--rest);font-size:1.35rem;font-weight:500;padding:0}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0;transition:background .2s}
.check svg{width:18px;height:18px;opacity:0}
.sess.done .check{background:var(--c)}
.sess.done .check svg{opacity:1}
.sess.just.done .check{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.sess[data-type="run"]{--c:var(--run);--soft:var(--run-soft)}
.sess[data-type="renfo"]{--c:var(--renfo);--soft:var(--renfo-soft)}
.body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0;display:flex;align-items:baseline;gap:7px}
.title{font-weight:600;white-space:nowrap;font-size:.98rem}
.sess.done .title{color:var(--muted)}
.meta{color:var(--muted);font-size:.84rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{border:0;background:none;color:var(--muted);font-weight:500;padding:10px 0;font-size:.9rem;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
#footer{text-align:center;margin-top:6px}
.save-state{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--hero);color:var(--hero-ink);font-size:.85rem;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
.save-state.show{opacity:1}

/* Feuille d’édition */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(8,13,25,.5)}
.sheet{padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 14px}
.sheet h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.7rem;margin:0 0 14px}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line-strong);background:none;font-weight:600}
.seg button[aria-pressed="true"][data-v="run"]{border-color:var(--run);background:var(--run-soft);color:var(--run)}
.seg button[aria-pressed="true"][data-v="renfo"]{border-color:var(--renfo);background:var(--renfo-soft);color:var(--renfo)}
label{display:block;font-size:.88rem;font-weight:500;color:var(--muted);margin-bottom:12px}
input,textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row label{flex:1}
.actions{display:flex;gap:10px;margin-top:8px}
.primary{flex:1;padding:13px;border:0;border-radius:12px;background:var(--hero);color:var(--hero-ink);font-weight:600}
.danger{padding:13px 16px;border:1px solid var(--line-strong);border-radius:12px;background:none;color:#D0453A;font-weight:600}

/* Mois */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--hero-muted);font-size:.84rem;margin:12px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot.miss{opacity:.55}
.legend .star-l{color:var(--hero-gold);font-size:1rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font-size:.8rem;color:var(--muted);font-weight:600;padding-bottom:2px}
.cell{min-height:68px;background:var(--surface);border:1.5px solid transparent;border-radius:12px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cell.out{opacity:.35}
.cell.today{border-color:var(--run)}
.cell.today .n{color:var(--run)}
.cell .n{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.1rem;line-height:1}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center}
.dot.run{--c:var(--run)}.dot.renfo{--c:var(--renfo)}
.dot.ok{background:var(--c)}
.dot.miss{opacity:.35}
.dot svg{width:9px;height:9px}
.cell.perfect{background:var(--gold-soft);border-color:var(--gold)}
.star{color:var(--gold);font-size:.9rem;line-height:1;margin-top:auto}
[hidden]{display:none!important}
.settings{display:flex;justify-content:center;margin-top:18px}
.gear{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--rest);font-size:.82rem;font-weight:500;padding:8px 10px;border-radius:20px}
.gear:active{background:var(--line)}
.track.month span{position:relative;overflow:hidden}
.track.month i{position:absolute;inset:0 auto 0 0;background:var(--run);border-radius:6px}
.track.month span.gold i{background:var(--hero-gold);width:100%!important}
.legend.below{color:var(--muted);margin:14px 2px 0}
.legend.below .star-l{color:var(--gold)}
.legend.below .dot.miss{opacity:.35}
#dayList{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.day-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line-strong);background:var(--bg);border-radius:12px;padding:12px 14px}
.day-item .dot{flex:none;width:16px;height:16px}
.di-text{flex:1;min-width:0;display:flex;flex-direction:column}
.di-text .meta{white-space:normal}
.di-go{color:var(--rest);font-size:1.4rem;line-height:1}
.primary.wide{width:100%;display:block}
.body{cursor:default}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#days.slide-next{animation:slideNext .26s ease-out}
#days.slide-prev{animation:slidePrev .26s ease-out}
@keyframes slideNext{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slidePrev{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header>div:first-child{min-width:0}
.track.month.perfect span i{background:var(--hero-gold);width:100%!important}
.month-win{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(8,13,25,.55);animation:mwIn .3s ease-out;padding:24px}
.month-win.out{opacity:0;transition:opacity .35s}
.mw-card{background:var(--hero);color:var(--hero-ink);border:2px solid var(--hero-gold);border-radius:24px;padding:26px 28px 24px;text-align:center;max-width:300px;animation:mwPop .55s cubic-bezier(.2,1.4,.4,1)}
.mw-medal{color:var(--hero-gold);display:grid;place-items:center;margin-bottom:8px;animation:mwSpin 1s ease-out}
.mw-title{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2.4rem;line-height:1;color:var(--hero-gold)}
.mw-sub{color:var(--hero-muted);margin-top:8px;font-size:.95rem}
@keyframes mwIn{from{opacity:0}to{opacity:1}}
@keyframes mwPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes mwSpin{from{transform:rotateY(540deg) scale(.5)}to{transform:none}}
.badges{display:flex;flex-direction:column;gap:8px}
.badge{--tc:var(--line-strong);--tc-soft:var(--bg);display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.badge.t1{--tc:#C07A3F;--tc-soft:#F8E9DC}
.badge.t2{--tc:#8C9AAE;--tc-soft:#EBEFF4}
.badge.t3{--tc:#D9A400;--tc-soft:#FFF3C9}
.badge.t4{--tc:#2BA6C2;--tc-soft:#DCF2F7}
.badge.t5{--tc:#8B5CF6;--tc-soft:#EEE7FE;border-color:#8B5CF6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{--tc-soft:#0D1320}:root:not([data-theme="light"]) .badge.t1{--tc-soft:#3A2617}:root:not([data-theme="light"]) .badge.t2{--tc-soft:#262E3C}:root:not([data-theme="light"]) .badge.t3{--tc-soft:#352D12}:root:not([data-theme="light"]) .badge.t4{--tc-soft:#12323A}:root:not([data-theme="light"]) .badge.t5{--tc-soft:#2A1F48}}
.medal{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--tc-soft);color:var(--tc);border:3px solid var(--tc)}
.badge.t0 .medal{color:var(--rest);border-style:dashed}
.badge.t5 .medal{background:var(--tc);color:#fff;box-shadow:0 0 0 3px var(--tc-soft)}
.b-info{flex:1;min-width:0}
.b-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.b-name{font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-tier{flex:none;font-size:.8rem;font-weight:600;color:var(--tc)}
.badge.t0 .b-tier{color:var(--rest)}
.b-bar{height:7px;border-radius:4px;background:var(--line);margin:7px 0 5px;overflow:hidden}
.b-bar i{display:block;height:100%;border-radius:4px;background:var(--tc)}
.badge.t0 .b-bar i{background:var(--run)}
.b-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.8rem}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.pips i.on{background:var(--tc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
  <header>
    <div>
      <h1 class="range" id="range">…</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="nav" id="nav">
      <button class="icon-btn" id="prev" aria-label="Semaine précédente">‹</button>
      <button class="icon-btn" id="next" aria-label="Semaine suivante">›</button>
    </div>
    <button class="icon-btn" id="closeTpl" aria-label="Fermer la semaine type" hidden>✕</button>
  </header>
  <div id="summary"></div>
  </div>

  <div class="tabs" role="group" aria-label="Affichage">
    <button id="tabWeek" aria-pressed="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Ma semaine</span></button>
    <button id="tabMonth" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M9.2 9.5v11M14.8 9.5v11M3.5 15h17"/></svg><span>Mois</span></button>
    <button id="tabBadges" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3l2.5 6M16 3l-2.5 6"/><circle cx="12" cy="15" r="6"/><path d="M12 12.5l.9 1.8 2 .3-1.45 1.4.35 2-1.8-1-1.8 1 .35-2-1.45-1.4 2-.3z" fill="currentColor" stroke="none"/></svg><span>Badges</span></button>
  </div>

  <div id="days"></div>
  <div id="footer"></div>
  <div class="settings"><button class="gear" id="gear"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Semaine type</span></button></div>
</div>
<div class="save-state" id="saveState">Enregistré</div>

<dialog id="dayDlg">
  <div class="sheet">
    <h2 id="dayTitle">Jour</h2>
    <div id="dayList"></div>
    <button type="button" class="primary wide" id="dayAdd">Ajouter une séance</button>
  </div>
</dialog>

<dialog id="dlg">
  <form class="sheet" method="dialog" id="form">
    <h2 id="dlgTitle">Séance</h2>
    <div class="seg" role="group" aria-label="Type de séance">
      <button type="button" data-v="run" aria-pressed="true">Course</button>
      <button type="button" data-v="renfo" aria-pressed="false">Renforcement</button>
    </div>
    <label>Intitulé<input id="fTitle" maxlength="60" placeholder="Footing, fractionné, sortie longue…"></label>
    <div class="row">
      <label id="kmWrap">Distance (km)<input id="fKm" type="number" inputmode="decimal" min="0" step="0.1"></label>
      <label>Durée (min)<input id="fMin" type="number" inputmode="numeric" min="0" step="1"></label>
    </div>
    <label>Détails<textarea id="fNotes" placeholder="Ex. 10 × 400 m, récup 1 min"></textarea></label>
    <div class="actions">
      <button type="button" class="danger" id="del">Supprimer</button>
      <button type="submit" class="primary" id="saveBtn">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MONTHS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const uid=()=>Math.random().toString(36).slice(2,10);
const S=(type,title,km,min,notes)=>({id:uid(),type,title,km:km??null,min:min??null,notes:notes||"",done:false});

function defaultTemplate(){
  return [
    [S("run","Footing",6,35,"Allure facile, tu dois pouvoir parler")],
    [S("renfo","Renforcement",null,20,"Gainage, squats, fentes, pont fessier")],

    const foot=el("div",{class:"b-foot"},el("span",{},v===5?"Niveau maximum atteint":fmtN(val)+" / "+fmtN(next)+" "+b.unit),pips);
    info.append(top,bar,foot);
    row.setAttribute("aria-label",b.name+" : "+tierName+", "+(v===5?"niveau maximum":fmtN(val)+" sur "+fmtN(next)+" "+b.unit));
    row.append(medal,info);list.append(row);
  });
  const daysEl=document.getElementById("days");daysEl.className="";daysEl.replaceChildren(list);
  document.getElementById("footer").replaceChildren();
}
function isMonthPerfect(y,m){
  let t=0;
  for(let d=new Date(y,m,1);d.getMonth()===m;d.setDate(d.getDate()+1)){
    for(const s of sessionsOn(d)){t++;if(!s.done)return false}
  }
  return t>0;
}
function burst(cv,origins,count,dur,cols){
  const dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const ps=[];origins.forEach(o=>{for(let i=0;i<count;i++){const a=o.angle+(Math.random()-.5)*o.spread,v=Math.random()*o.power+o.power*.5;
    ps.push({x:o.x*W,y:o.y*H,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:Math.random()*7+5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],round:Math.random()<.35,delay:o.delay||0})}});
  const t0=performance.now();
  return new Promise(res=>{(function f(t){const el_=t-t0,k=el_/dur;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{if(el_<p.delay)return;p.vy+=.25;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.globalAlpha=Math.max(0,1-k*k*k);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.s/2.4,0,7);ctx.fill()}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(k<1)requestAnimationFrame(f);else res()})(t0)});
}

function celebrate(){
  setTimeout(()=>toast("★ Semaine parfaite !"),700);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cs=getComputedStyle(document.documentElement);
  const cols=["--run","--renfo","--hero-gold"].map(v=>cs.getPropertyValue(v).trim());
  const cv=document.createElement("canvas");cv.className="confetti";document.body.append(cv);
  const dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*60,y:H*.32,vx:(Math.random()-.5)*9,vy:-Math.random()*10-4,
    s:Math.random()*6+5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*3)],round:Math.random()<.4}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1600;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.globalAlpha=Math.max(0,1-k*k);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.s/2.4,0,7);ctx.fill()}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(k<1)requestAnimationFrame(f);else cv.remove()})(t0);
}

// Sauvegarde : base de données de l’artifact si disponible, sinon ce navigateur
const LS="planning-course-v1";
let dbDoc=null,saveTimer=null,ready=false;
function toast(t){const s=document.getElementById("saveState");s.textContent=t;s.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>s.classList.remove("show"),1400)}
function queueSave(show){
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(!ready)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(!dbDoc){if(show)toast("Enregistré sur cet appareil");return}
    try{await dbDoc.set({json:JSON.stringify(state),updated:Date.now()});if(show)toast("Enregistré")}
    catch(e){toast("Échec de l’enregistrement, réessaie dans un instant")}
  },600);
}
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const s=JSON.parse(raw);if(s&&s.template)state=s}}catch(e){}}

loadLocal();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
(async()=>{
  try{
    if(window.claude&&claude.use){
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      const id=user?await user.id():null;
      if(db&&id){
        dbDoc=db.collection("data/users/"+id).doc("planning");
        const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000));
        const snap=await Promise.race([dbDoc.get(),timeout]);
        if(snap.exists){const s=JSON.parse(snap.data().json);if(s&&s.template){state=s;render()}}
        ready=true;
        if(!snap.exists)queueSave(false);
        return;
      }
    }
  }catch(e){dbDoc=null}
  ready=true;
})();
