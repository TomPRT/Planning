<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon planning course</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Course">
<meta name="theme-color" content="#13203A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2540" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#13203A; --muted:#64728A; --line:#E0E5EC; --line-strong:#CBD3DE;
  --hero:#13203A; --hero-ink:#FFFFFF; --hero-muted:#A9B5C9; --hero-lane:rgba(255,255,255,.13);
  --run:#E8590C; --run-soft:#FDEBDF; --renfo:#0F8F7E; --renfo-soft:#DDF3EF; --rest:#A3AEBD;
  --gold:#C08F00; --gold-soft:#FFF3C9; --hero-gold:#F5C842; --today:#FFF6F0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1320; --surface:#172034; --ink:#E9EEF6; --muted:#93A0B5; --line:#243049; --line-strong:#33405C;
    --hero:#1A2540; --hero-lane:rgba(255,255,255,.1);
    --run:#FF8A4C; --run-soft:#3F2618; --renfo:#3CC7B2; --renfo-soft:#143936; --rest:#5E6A7E;
    --gold:#F2C94C; --gold-soft:#352D12; --today:#221E22;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1320; --surface:#172034; --ink:#E9EEF6; --muted:#93A0B5; --line:#243049; --line-strong:#33405C;
  --hero:#1A2540; --hero-lane:rgba(255,255,255,.1);
  --run:#FF8A4C; --run-soft:#3F2618; --renfo:#3CC7B2; --renfo-soft:#143936; --rest:#5E6A7E;
  --gold:#F2C94C; --gold-soft:#352D12; --today:#221E22;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:10}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 32px}

/* Bandeau : le seul élément fort de la page, aux couleurs de l’icône */
.hero{background:var(--hero);color:var(--hero-ink);margin:0 -14px;padding:14px 18px 16px;border-radius:0 0 22px 22px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 14px}
.range{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2.5rem;line-height:.95;letter-spacing:-.005em;margin:0}
.sub{color:var(--hero-muted);font-size:.95rem;margin:6px 0 0}
.nav{display:flex;gap:8px;padding-top:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--hero-ink);display:grid;place-items:center;font-size:1.35rem;line-height:1;padding:0 0 2px}
.icon-btn:active{background:rgba(255,255,255,.2)}

/* La piste : une ligne par séance */
.track{display:flex;gap:5px;margin:0 0 9px}
.track span{flex:1;height:12px;border-radius:6px;background:var(--hero-lane);transition:background .3s}
.track span.run.ok{background:var(--run)}
.track span.renfo.ok{background:var(--renfo)}
.track.perfect span,.track.perfect span.ok{background:var(--hero-gold)}
.stats{display:flex;justify-content:space-between;color:var(--hero-muted);font-size:.92rem;margin:0}
.stats b{color:var(--hero-ink);font-weight:600;font-size:1.05rem}
.gold-txt b{color:var(--hero-gold)}
.note{color:var(--hero-muted);font-size:.92rem;margin:0}

/* Onglets */
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 12px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tab-ind{position:absolute;view-transition-name:tab-ind;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:10px;background:var(--hero);transition:transform .28s cubic-bezier(.3,.7,.3,1)}
.tabs[data-active="month"] .tab-ind{transform:translateX(100%)}
.tabs[data-active="stats"] .tab-ind{transform:translateX(200%)}
.tabs[data-active="badges"] .tab-ind{transform:translateX(300%)}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;border:0;background:none;padding:7px 2px 6px;border-radius:10px;font-weight:600;font-size:.76rem;white-space:nowrap;color:var(--muted);transition:color .2s}
.tabs button[aria-pressed="true"]{color:var(--hero-ink)}
.tabs button[aria-pressed="false"]:active{color:var(--ink)}

/* Semaine */
.week{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.week.gold{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.day{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.today{background:var(--today);box-shadow:inset 4px 0 0 var(--run)}
.day-head{flex:none;width:70px;display:flex;flex-direction:column;justify-content:center;padding:8px 0 8px 14px}
.day-name{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.35rem;line-height:1.05}
.day.today .day-name{color:var(--run)}
.day-date{color:var(--muted);font-size:.82rem;line-height:1.2}
.day-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.rest{color:var(--rest);font-size:.9rem;font-style:italic;padding:10px 6px}
.sess{display:flex;align-items:center;gap:10px;padding:6px 6px}
.sess + .sess{border-top:1px dashed var(--line)}
.plus{flex:none;width:40px;border:0;background:none;color:var(--rest);font-size:1.35rem;font-weight:500;padding:0}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0;transition:background .2s}
.check svg{width:18px;height:18px;opacity:0}
.sess.done .check{background:var(--c)}
.sess.done .check svg{opacity:1}
.sess.just.done .check{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.sess[data-type="run"]{--c:var(--run);--soft:var(--run-soft)}
.sess[data-type="renfo"]{--c:var(--renfo);--soft:var(--renfo-soft)}
.body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0;display:flex;align-items:baseline;gap:7px}
.title{font-weight:600;white-space:nowrap;font-size:.98rem}
.sess.done .title{color:var(--muted)}
.meta{color:var(--muted);font-size:.84rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{border:0;background:none;color:var(--muted);font-weight:500;padding:10px 0;font-size:.9rem;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
#footer{text-align:center;margin-top:6px}
.save-state{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--hero);color:var(--hero-ink);font-size:.85rem;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
.save-state.show{opacity:1}

/* Feuille d’édition */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(8,13,25,.5)}
.sheet{padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 14px}
.sheet h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.7rem;margin:0 0 14px}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line-strong);background:none;font-weight:600}
.seg button[aria-pressed="true"][data-v="run"]{border-color:var(--run);background:var(--run-soft);color:var(--run)}
.seg button[aria-pressed="true"][data-v="renfo"]{border-color:var(--renfo);background:var(--renfo-soft);color:var(--renfo)}
label{display:block;font-size:.88rem;font-weight:500;color:var(--muted);margin-bottom:12px}
input,textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row label{flex:1}
.actions{display:flex;gap:10px;margin-top:8px}
.primary{flex:1;padding:13px;border:0;border-radius:12px;background:var(--hero);color:var(--hero-ink);font-weight:600}
.danger{padding:13px 16px;border:1px solid var(--line-strong);border-radius:12px;background:none;color:#D0453A;font-weight:600}

/* Mois */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--hero-muted);font-size:.84rem;margin:12px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot.miss{opacity:.55}
.legend .star-l{color:var(--hero-gold);font-size:1rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font-size:.8rem;color:var(--muted);font-weight:600;padding-bottom:2px}
.cell{min-height:68px;background:var(--surface);border:1.5px solid transparent;border-radius:12px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cell.out{opacity:.35}
.cell.today{border-color:var(--run)}
.cell.today .n{color:var(--run)}
.cell .n{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.1rem;line-height:1}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center}
.dot.run{--c:var(--run)}.dot.renfo{--c:var(--renfo)}
.dot.ok{background:var(--c)}
.dot.miss{opacity:.35}
.dot svg{width:9px;height:9px}
.cell.perfect{background:var(--gold-soft);border-color:var(--gold)}
.star{color:var(--gold);font-size:.9rem;line-height:1;margin-top:auto}
[hidden]{display:none!important}
.settings{display:flex;justify-content:center;margin-top:18px}
.gear{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--rest);font-size:.82rem;font-weight:500;padding:8px 10px;border-radius:20px}
.gear:active{background:var(--line)}
.track.month span{position:relative;overflow:hidden}
.track.month i{position:absolute;inset:0 auto 0 0;background:var(--run);border-radius:6px}
.track.month span.gold i{background:var(--hero-gold);width:100%!important}
.legend.below{color:var(--muted);margin:14px 2px 0}
.legend.below .star-l{color:var(--gold)}
.legend.below .dot.miss{opacity:.35}
#dayList{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.day-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line-strong);background:var(--bg);border-radius:12px;padding:12px 14px}
.day-item .dot{flex:none;width:16px;height:16px}
.di-text{flex:1;min-width:0;display:flex;flex-direction:column}
.di-text .meta{white-space:normal}
.di-go{color:var(--rest);font-size:1.4rem;line-height:1}
.primary.wide{width:100%;display:block}
.body{cursor:default}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#pane.slide-next{animation:slideNext .3s cubic-bezier(.25,.8,.25,1)}
#pane.slide-prev{animation:slidePrev .3s cubic-bezier(.25,.8,.25,1)}
@keyframes slideNext{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slidePrev{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header>div:first-child{min-width:0}
.track.month.perfect span i{background:var(--hero-gold);width:100%!important}
.month-win{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(8,13,25,.55);animation:mwIn .3s ease-out;padding:24px}
.month-win.out{opacity:0;transition:opacity .35s}
.mw-card{background:var(--hero);color:var(--hero-ink);border:2px solid var(--hero-gold);border-radius:24px;padding:26px 28px 24px;text-align:center;max-width:300px;animation:mwPop .55s cubic-bezier(.2,1.4,.4,1)}
.mw-medal{color:var(--hero-gold);display:grid;place-items:center;margin-bottom:8px;animation:mwSpin 1s ease-out}
.mw-title{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2.4rem;line-height:1;color:var(--hero-gold)}
.mw-sub{color:var(--hero-muted);margin-top:8px;font-size:.95rem}
@keyframes mwIn{from{opacity:0}to{opacity:1}}
@keyframes mwPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes mwSpin{from{transform:rotateY(540deg) scale(.5)}to{transform:none}}
.badges{display:flex;flex-direction:column;gap:8px}
.badge,.lvl,.bd-medal{--tc:var(--line-strong);--tc-soft:var(--bg)}
.badge{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.t1{--tc:#C07A3F;--tc-soft:#F8E9DC}
.t2{--tc:#8C9AAE;--tc-soft:#EBEFF4}
.t3{--tc:#D9A400;--tc-soft:#FFF3C9}
.t4{--tc:#2BA6C2;--tc-soft:#DCF2F7}
.t5{--tc:#8B5CF6;--tc-soft:#EEE7FE}
.badge.t5{border-color:#8B5CF6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :is(.badge,.lvl,.bd-medal){--tc-soft:#0D1320}:root:not([data-theme="light"]) .t1{--tc-soft:#3A2617}:root:not([data-theme="light"]) .t2{--tc-soft:#262E3C}:root:not([data-theme="light"]) .t3{--tc-soft:#352D12}:root:not([data-theme="light"]) .t4{--tc-soft:#12323A}:root:not([data-theme="light"]) .t5{--tc-soft:#2A1F48}}
.medal{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--tc-soft);color:var(--tc);border:3px solid var(--tc)}
.badge.t0 .medal{color:var(--rest);border-style:dashed}
.badge.t5 .medal{background:var(--tc);color:#fff;box-shadow:0 0 0 3px var(--tc-soft)}
.b-info{flex:1;min-width:0}
.b-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.b-name{font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-tier{flex:none;font-size:.8rem;font-weight:600;color:var(--tc)}
.badge.t0 .b-tier{color:var(--rest)}
.b-bar{height:7px;border-radius:4px;background:var(--line);margin:7px 0 5px;overflow:hidden}
.b-bar i{display:block;height:100%;border-radius:4px;background:var(--tc)}
.badge.t0 .b-bar i{background:var(--run)}
.b-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.8rem}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.pips i.on{background:var(--tc)}
/* Transitions de vue */
.wrap{touch-action:pan-y}
#pane{view-transition-name:content;will-change:transform}
header>div:first-child{view-transition-name:hero-text;flex:1}
#tabWeek{view-transition-name:tab-w}#tabMonth{view-transition-name:tab-m}#tabBadges{view-transition-name:tab-b}#tabStats{view-transition-name:tab-s}
::view-transition-old(hero-text),::view-transition-new(hero-text){width:100%;height:auto;object-fit:none;object-position:left top}
#summary{view-transition-name:hero-sum}
::view-transition-group(*){animation-duration:.36s;animation-timing-function:cubic-bezier(.25,.85,.25,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
::view-transition-group(content){animation:none}
::view-transition-old(content){animation:.34s cubic-bezier(.3,.6,.2,1) both vtOutL}
::view-transition-new(content){animation:.36s cubic-bezier(.2,.8,.2,1) both vtInR}
html[data-dir="prev"]::view-transition-old(content){animation-name:vtOutR}
html[data-dir="prev"]::view-transition-new(content){animation-name:vtInL}
html[data-dir="none"]::view-transition-old(content){animation-name:vtFadeOut}
html[data-dir="none"]::view-transition-new(content){animation-name:vtFadeUp}
::view-transition-old(hero-text){animation:.2s ease-in both vtTxtOut}
::view-transition-new(hero-text){animation:.3s .06s cubic-bezier(.2,.8,.2,1) both vtTxtIn}
::view-transition-group(hero-text){animation:none}
@keyframes vtOutL{to{transform:translateX(-32%);opacity:0}}
@keyframes vtOutR{to{transform:translateX(32%);opacity:0}}
@keyframes vtInR{from{transform:translateX(32%);opacity:0}}
@keyframes vtInL{from{transform:translateX(-32%);opacity:0}}
@keyframes vtFadeOut{to{opacity:0;transform:scale(.98)}}
@keyframes vtFadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes vtTxtOut{to{opacity:0;transform:translateY(-8px)}}
@keyframes vtTxtIn{from{opacity:0;transform:translateY(8px)}}

/* Feuilles qui montent et descendent */
dialog[open]{animation:sheetUp .36s cubic-bezier(.2,.9,.25,1)}
dialog[open]::backdrop{animation:fadeIn .3s ease}
dialog.closing{animation:sheetDown .21s cubic-bezier(.4,0,.8,.4) forwards}
dialog.closing::backdrop{animation:fadeOut .21s ease forwards}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}

/* Retours au toucher */
.tabs button,.icon-btn,.plus,.primary,.danger,.day-item,.cell,.gear,.link,.seg button{transition:transform .15s ease,background-color .2s,color .2s}
.tabs button:active,.icon-btn:active,.primary:active,.danger:active,.day-item:active,.cell:active,.seg button:active{transform:scale(.96)}
.plus:active,.gear:active{transform:scale(.88)}
.check:active{transform:scale(.9)}
.check{transition:background .2s,transform .15s}
.sess .title{transition:color .3s}

/* Message en bas */
.save-state{transform:translate(-50%,12px);transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1.3)}
.save-state.show{transform:translate(-50%,0)}

/* Remplissages qui s’animent */
.track.month i{transition:width .5s cubic-bezier(.25,.8,.25,1)}
.b-bar i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms + .12s)}
.badge{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.badge .medal{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0)*45ms + .1s)}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* Jour de la séance */
.field-l{font-size:.88rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.daypick button{border:1.5px solid var(--line-strong);background:none;border-radius:10px;padding:9px 0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.05rem;color:var(--muted);transition:transform .15s,background-color .2s,color .2s,border-color .2s}
.daypick button[aria-pressed="true"]{background:var(--hero);border-color:var(--hero);color:var(--hero-ink)}
.daypick button:active{transform:scale(.92)}

/* Objectif */
.goal{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 0;padding:11px 14px 15px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;overflow:hidden;transition:transform .15s}
.goal:active{transform:scale(.98)}
.g-ico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--run-soft);color:var(--run)}
.g-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.g-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-txt small{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-big{flex:none;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.8rem;line-height:1;color:var(--run)}
.g-bar{position:absolute;left:14px;right:14px;bottom:7px;height:4px;border-radius:2px;background:var(--line)}
.g-bar i{display:block;height:100%;border-radius:2px;background:var(--run);transition:width .6s cubic-bezier(.25,.8,.25,1)}
.goal.live{border-color:var(--run);box-shadow:0 0 0 2px var(--run)}
.goal.live .g-big{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.goal+.tabs{margin-top:10px}

/* Stats */
.statsv{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin-bottom:8px}
.muted{color:var(--muted);font-weight:500;font-size:.85rem}
.trend{font-size:.82rem;font-weight:600;padding:2px 8px;border-radius:20px}
.trend.up{color:var(--renfo);background:var(--renfo-soft)}
.trend.down{color:var(--run);background:var(--run-soft)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .bar{fill:var(--run);opacity:.45;transform-box:fill-box;transform-origin:bottom;animation:barUp .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*35ms)}
.chart .bar.cur{opacity:1}
.chart .bar.gold{fill:var(--gold);opacity:1}
.chart .val{font:600 11px "Barlow",system-ui,sans-serif;fill:var(--ink)}
.chart .lab{font:500 10px "Barlow",system-ui,sans-serif;fill:var(--muted)}
@keyframes barUp{from{transform:scaleY(0)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms + .1s)}
.t-l{color:var(--muted);font-size:.8rem;font-weight:500}
.t-v{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.6rem;line-height:1.1}
.t-s{color:var(--muted);font-size:.74rem}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:3px}
.split i{display:block;height:100%;border-radius:6px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both .15s}
.split .r{background:var(--run)}.split .f{background:var(--renfo)}
.split-l{display:flex;justify-content:space-between;color:var(--muted);font-size:.84rem;margin-top:8px}
.split-l span{display:inline-flex;align-items:center;gap:6px}
.settings{gap:6px}
/* Séance faite */
.done-sub{color:var(--muted);margin:-8px 0 14px;font-size:.92rem}
.pace{display:flex;flex-direction:column;align-items:center;background:var(--run-soft);border-radius:14px;padding:12px;margin:2px 0 14px}
.pace-v{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2.2rem;line-height:1;color:var(--run)}
.pace-l{color:var(--muted);font-size:.82rem;margin-top:2px}
.ghost{padding:13px 14px;border:1px solid var(--line-strong);border-radius:12px;background:none;font-weight:600;color:var(--ink)}
.ghost:active{transform:scale(.96)}
/* Badges cliquables + détail */
button.badge{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s}
button.badge:active{transform:scale(.98)}
.badge .b-info::after{content:none}
.bd-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.bd-head h2{margin:0}
.bd-medal{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--tc-soft);color:var(--tc);border:3px solid var(--tc);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both .05s}
.bd-medal.t0{color:var(--rest);border-style:dashed}
.bd-medal.t5{background:var(--tc);color:#fff;box-shadow:0 0 0 4px var(--tc-soft)}
.bd-tier{font-weight:600;font-size:.9rem;color:var(--tc)}
.bd-tier.t0{color:var(--muted)}
.bd-desc{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.bd-now{display:flex;align-items:baseline;gap:8px}
.bd-val{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2.6rem;line-height:1}
.bd-unit{color:var(--muted)}
.bd-next{margin:4px 0 14px;font-weight:500}
.lvls{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.lvl{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.lvl:nth-child(2){animation-delay:.04s}.lvl:nth-child(3){animation-delay:.08s}.lvl:nth-child(4){animation-delay:.12s}.lvl:nth-child(5){animation-delay:.16s}
.l-dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 .85rem "Barlow Condensed","Arial Narrow",sans-serif;border:2px solid var(--tc);color:var(--tc)}
.lvl.got .l-dot{background:var(--tc);color:#fff}
.lvl.lock{opacity:.55}
.lvl.lock .l-dot{border-style:dashed}
.lvl.curr{border-color:var(--tc);background:var(--tc-soft);padding-bottom:16px}
.l-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.l-name{font-weight:600}
.l-th{color:var(--muted);font-size:.82rem}
.l-st{flex:none;font-size:.8rem;font-weight:600;color:var(--muted)}
.lvl.got .l-st,.lvl.curr .l-st{color:var(--tc)}
.l-bar{position:absolute;left:52px;right:12px;bottom:7px;height:4px;border-radius:2px;background:var(--line)}
.l-bar i{display:block;height:100%;border-radius:2px;background:var(--tc);transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both .2s}
#badgeDlg .sheet{max-height:88vh;overflow-y:auto}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
  <header>
    <div>
      <h1 class="range" id="range">…</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="nav" id="nav">
      <button class="icon-btn" id="prev" aria-label="Semaine précédente">‹</button>
      <button class="icon-btn" id="next" aria-label="Semaine suivante">›</button>
    </div>
    <button class="icon-btn" id="closeTpl" aria-label="Fermer la semaine type" hidden>✕</button>
  </header>
  <div id="summary"></div>
  </div>

  <button class="goal" id="goalBar" hidden></button>
  <div class="tabs" role="group" aria-label="Affichage">
    <span class="tab-ind" aria-hidden="true"></span>
    <button id="tabWeek" aria-pressed="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Ma semaine</span></button>
    <button id="tabMonth" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M9.2 9.5v11M14.8 9.5v11M3.5 15h17"/></svg><span>Mois</span></button>
    <button id="tabStats" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M10 20V5M15 20v-9M20 20V8"/></svg><span>Stats</span></button>
    <button id="tabBadges" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3l2.5 6M16 3l-2.5 6"/><circle cx="12" cy="15" r="6"/><path d="M12 12.5l.9 1.8 2 .3-1.45 1.4.35 2-1.8-1-1.8 1 .35-2-1.45-1.4 2-.3z" fill="currentColor" stroke="none"/></svg><span>Badges</span></button>
  </div>

  <div id="pane">
  <div id="days"></div>
  <div id="footer"></div>
  <div class="settings"><button class="gear" id="gear"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Semaine type</span></button><button class="gear" id="goalBtn"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>Objectif</span></button></div>
  </div>
</div>
<div class="save-state" id="saveState">Enregistré</div>

<dialog id="badgeDlg">
  <div class="sheet">
    <div id="bdBody"></div>
    <button type="button" class="primary wide" id="bdClose">Fermer</button>
  </div>
</dialog>

<dialog id="doneDlg">
  <form class="sheet" id="doneForm">
    <h2>Bien joué !</h2>
    <p class="done-sub" id="doneSub"></p>
    <div class="row">
      <label>Distance réelle (km)<input id="dKm" type="number" inputmode="decimal" min="0" step="0.01"></label>
      <label>Durée (min)<input id="dMin" type="number" inputmode="decimal" min="0" step="1"></label>
    </div>
    <div class="pace"><span class="pace-v" id="dPace">–</span><span class="pace-l">allure moyenne par km</span></div>
    <div class="actions">
      <button type="button" class="ghost" id="dSkip">Garder le prévu</button>
      <button type="submit" class="primary">Valider</button>
    </div>
  </form>
</dialog>

<dialog id="goalDlg">
  <form class="sheet" id="goalForm">
    <h2>Mon objectif</h2>
    <label>Objectif<input id="gName" maxlength="40" placeholder="10 km, semi-marathon, trail…"></label>
    <label>Date<input id="gDate" type="date" required></label>
    <div class="actions">
      <button type="button" class="danger" id="gDel">Supprimer</button>
      <button type="submit" class="primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="dayDlg">
  <div class="sheet">
    <h2 id="dayTitle">Jour</h2>
    <div id="dayList"></div>
    <button type="button" class="primary wide" id="dayAdd">Ajouter une séance</button>
  </div>
</dialog>

<dialog id="dlg">
  <form class="sheet" method="dialog" id="form">
    <h2 id="dlgTitle">Séance</h2>
    <div class="seg" role="group" aria-label="Type de séance">
      <button type="button" data-v="run" aria-pressed="true">Course</button>
      <button type="button" data-v="renfo" aria-pressed="false">Renforcement</button>
    </div>
    <div class="field-l">Jour</div>
    <div class="daypick" role="group" aria-label="Jour de la séance">
      <button type="button" data-d="0" aria-label="Lundi">L</button><button type="button" data-d="1" aria-label="Mardi">M</button><button type="button" data-d="2" aria-label="Mercredi">M</button><button type="button" data-d="3" aria-label="Jeudi">J</button><button type="button" data-d="4" aria-label="Vendredi">V</button><button type="button" data-d="5" aria-label="Samedi">S</button><button type="button" data-d="6" aria-label="Dimanche">D</button>
    </div>
    <label>Intitulé<input id="fTitle" maxlength="60" placeholder="Footing, fractionné, sortie longue…"></label>
    <div class="row">
      <label id="kmWrap">Distance (km)<input id="fKm" type="number" inputmode="decimal" min="0" step="0.1"></label>
      <label>Durée (min)<input id="fMin" type="number" inputmode="numeric" min="0" step="1"></label>
    </div>
    <label>Détails<textarea id="fNotes" placeholder="Ex. 10 × 400 m, récup 1 min"></textarea></label>
    <div class="actions">
      <button type="button" class="danger" id="del">Supprimer</button>
      <button type="submit" class="primary" id="saveBtn">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MONTHS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const uid=()=>Math.random().toString(36).slice(2,10);
const S=(type,title,km,min,notes)=>({id:uid(),type,title,km:km??null,min:min??null,notes:notes||"",done:false});

function defaultTemplate(){
  return [
    [S("run","Footing",6,35,"Allure facile, tu dois pouvoir parler")],
    [S("renfo","Renforcement",null,20,"Gainage, squats, fentes, pont fessier")],
    [S("run","Fractionné",7,45,"Échauffement 15 min, 8 × 400 m, retour au calme")],
    [],
    [S("run","Footing",6,35,"")],
    [S("renfo","Renforcement",null,15,"Mollets, chevilles, abdos")],
    [S("run","Sortie longue",10,65,"Allure lente et régulière")]
  ];
}
let state={template:defaultTemplate(),weeks:{}};
let mode="week"; // "week" | "tpl"
let weekOffset=0;
let monthOffset=0;
let lastToggled=null;
let editing=null; // {dayIdx, id|null}

function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x}
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function currentMonday(){const m=mondayOf(new Date());m.setDate(m.getDate()+weekOffset*7);return m}
function cloneTpl(){return state.template.map(day=>day.map(s=>({...s,id:uid(),done:false})))}
function weekDays(){
  if(mode==="tpl")return state.template;
  const k=keyOf(currentMonday());
  if(!state.weeks[k]){state.weeks[k]=cloneTpl();queueSave(false)}
  return state.weeks[k];
}
const kmOf=s=>s.akm!=null?+s.akm:(+s.km||0);
const minOf=s=>s.amin!=null?+s.amin:(+s.min||0);
function fmtPace(km,min){if(!km||!min)return "";const t=Math.round(min*60/km),m=Math.floor(t/60),sec=t%60;return m+":"+String(sec).padStart(2,"0")}
function toggleSess(s,d,patch){
  const b0=badgeLevels();const wk=weekDays().flat();const was=wk.every(x=>x.done);const wasM=isMonthPerfect(d.getFullYear(),d.getMonth());
  s.done=!s.done;
  if(s.done&&patch)Object.assign(s,patch);
  if(!s.done){delete s.akm;delete s.amin}
  lastToggled=s.id;render();lastToggled=null;queueSave(true);
  if(!wasM&&isMonthPerfect(d.getFullYear(),d.getMonth()))celebrateMonth(d);else if(!was&&wk.every(x=>x.done))celebrate();
  announceBadges(b0);
}
function fmtMeta(s){
  if(s.done&&s.type==="run"&&s.akm!=null){const p=[fmtN(s.akm)+" km"];if(s.amin)p.push(fmtDur(s.amin));const pc=fmtPace(s.akm,s.amin);if(pc)p.push(pc+" /km");return p.join(" · ")}const p=[];if(s.type==="run"&&s.km)p.push(String(s.km).replace(".",",")+" km");if(s.min)p.push(s.min+" min");if(s.notes)p.push(s.notes);return p.join(", ")}
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==null&&v!==undefined)e.setAttribute(k,v)}for(const c of kids){if(c!=null)e.append(c)}return e}
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--surface)"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

function render(){
  updateTabs();
  renderGoal();
  if(mode==="month"){renderMonth();return}
  if(mode==="badges"){renderBadges();return}
  if(mode==="stats"){renderStats();return}
  const days=weekDays();
  const mon=currentMonday();
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const range=document.getElementById("range"),sub=document.getElementById("sub");
  if(mode==="tpl"){range.textContent="Semaine type";sub.textContent="Base utilisée pour chaque nouvelle semaine"}
  else{
    range.textContent=mon.getDate()+(mon.getMonth()!==sun.getMonth()?" "+MONTHS[mon.getMonth()]:"")+" – "+sun.getDate()+" "+MONTHS[sun.getMonth()];
    sub.textContent=weekOffset===0?todayLine():weekOffset===1?"Semaine prochaine":weekOffset===-1?"Semaine dernière":(weekOffset>0?"Dans "+weekOffset+" semaines":"Il y a "+(-weekOffset)+" semaines");
  }

  // Résumé
  const summary=document.getElementById("summary");summary.replaceChildren();
  const all=days.flat();
  if(mode==="week"&&all.length){
    const track=el("div",{class:"track"+(all.every(s=>s.done)?" perfect":""),"aria-hidden":"true"});
    all.forEach(s=>track.append(el("span",{class:s.type+(s.done?" ok":"")})));
    const done=all.filter(s=>s.done).length;
    const kmPlan=all.filter(s=>s.type==="run").reduce((a,s)=>a+(+s.km||0),0);
    const kmDone=all.filter(s=>s.type==="run"&&s.done).reduce((a,s)=>a+kmOf(s),0);
    const f=n=>(Math.round(n*10)/10).toString().replace(".",",");
    const st=el("div",{class:"stats"});
    st.innerHTML=`${done===all.length?'<span class="gold-txt"><b>★ Semaine parfaite</b></span>':`<span><b>${done}/${all.length}</b> séances faites</span>`}<span><b>${f(kmDone)}</b> / ${f(kmPlan)} km</span>`;
    summary.append(track,st);
  }else if(mode==="tpl"){
    summary.append(el("p",{class:"note"},"Les changements ici s’appliquent aux semaines que tu n’as pas encore ouvertes. Pour une semaine déjà créée, utilise « Repartir de la semaine type »."));
  }

  // Jours
  const wrap=document.getElementById("days");wrap.replaceChildren();wrap.className="week"+(mode==="week"&&all.length&&all.every(s=>s.done)?" gold":"");
  const todayKey=keyOf(new Date());
  days.forEach((list,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const isToday=mode==="week"&&keyOf(d)===todayKey;
    const card=el("section",{class:"day"+(isToday?" today":"")});
    card.append(el("div",{class:"day-head"},el("span",{class:"day-name"},DAYS[i].slice(0,3)+"."),mode==="week"?el("span",{class:"day-date"},d.getDate()+" "+MONTHS[d.getMonth()]):null));
    const bodyCol=el("div",{class:"day-body"});
    if(!list.length)bodyCol.append(el("div",{class:"rest"},"Repos"));
    list.forEach(s=>{
      const row=el("div",{class:"sess"+(s.done&&mode==="week"?" done":"")+(s.id===lastToggled?" just":""),"data-type":s.type});
      if(mode==="week"){
        const c=el("button",{class:"check","aria-label":(s.done?"Marquer non faite : ":"Marquer faite : ")+s.title,"aria-pressed":s.done,onclick:()=>{if(!s.done&&s.type==="run")openDone(s,patch=>toggleSess(s,d,patch));else toggleSess(s,d)}});
        c.innerHTML=CHECK;row.append(c);
      }
      row.append(el("div",{class:"body"},el("span",{class:"title"},s.title||(s.type==="run"?"Course":"Renforcement")),el("span",{class:"meta"},fmtMeta(s))));
      bodyCol.append(row);
    });
    const pen=el("button",{class:"plus","aria-label":"Modifier le "+DAYS[i].toLowerCase(),onclick:()=>openDay(i)});pen.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
    card.append(bodyCol,pen);
    wrap.append(card);
  });

  const foot=document.getElementById("footer");foot.replaceChildren();
  if(mode==="week"){
    foot.append(el("button",{class:"link",onclick:()=>{if(confirm("Remplacer cette semaine par ta semaine type ? Les séances cochées seront décochées.")){state.weeks[keyOf(currentMonday())]=cloneTpl();render();queueSave(true)}}},"Repartir de la semaine type"));
    if(weekOffset!==0)foot.append(el("br"),el("button",{class:"link",onclick:()=>{weekOffset=0;render()}},"Revenir à cette semaine"));
  }
}

// Édition
const dlg=document.getElementById("dlg");
let fType="run";

const MONTHS_FULL=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function sessionsOn(d){const w=state.weeks[keyOf(mondayOf(d))];return (w||state.template)[(d.getDay()+6)%7].map(s=>w?s:{...s,done:false})}
function isPerfect(d){const w=state.weeks[keyOf(mondayOf(d))];if(!w)return false;const a=w.flat();return a.length>0&&a.every(s=>s.done)}
function renderMonth(){
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const first=new Date(now.getFullYear(),now.getMonth()+monthOffset,1);
  const y=first.getFullYear(),m=first.getMonth();
  const last=new Date(y,m+1,0);

  const st0=streak();document.getElementById("sub").textContent=st0?"★ Série : "+st0+" semaine"+(st0>1?"s":"")+" parfaite"+(st0>1?"s":"")+" d’affilée":"Touche un jour pour ouvrir sa semaine";

  let done=0,total=0,km=0;
  for(let d=new Date(first);d<=last;d.setDate(d.getDate()+1)){
    sessionsOn(d).forEach(s=>{total++;if(s.done){done++;if(s.type==="run")km+=kmOf(s)}});
  }

    let a=0,b=0;
    for(let i=0;i<7;i++){const d=new Date(w);d.setDate(w.getDate()+i);if(d.getMonth()!==m)continue;sessionsOn(d).forEach(s=>{b++;if(s.done)a++})}

    const nd=list.filter(s=>s.done).length;
    const label=day.getDate()+" "+MONTHS_FULL[day.getMonth()]+" : "+(list.length?nd+" séance"+(list.length>1?"s":"")+" faite"+(nd>1?"s":"")+" sur "+list.length:"repos");
    const cell=el("button",{class:"cell"+(day.getMonth()!==m?" out":"")+(isToday?" today":"")+(perfect?" perfect":""),"aria-label":label+(perfect?", semaine parfaite":""),onclick:()=>{weekOffset=Math.round((mondayOf(day)-thisMon)/(7*864e5));mode="week";render();window.scrollTo(0,0)}});

    cell.append(dots);

const REDUCED=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy=false;
function animate(dir,update){
  const pane=document.getElementById("pane");
  const done=()=>{pane.style.transition="";pane.style.transform="";pane.style.opacity=""};
  if(REDUCED()){update();done();return}
  if(document.startViewTransition){
    if(busy){update();done();return}
    busy=true;
    document.documentElement.dataset.dir=dir>0?"next":dir<0?"prev":"none";
    const vt=document.startViewTransition(()=>{update();done();window.scrollTo(0,0)});
    vt.finished.finally(()=>{busy=false});
    return;
  }
  update();done();window.scrollTo(0,0);
  if(dir){pane.classList.remove("slide-next","slide-prev");void pane.offsetWidth;pane.classList.add(dir>0?"slide-next":"slide-prev")}
}
function go(dir){
  if(mode==="tpl"||mode==="badges"||mode==="stats")return;
  animate(dir,()=>{if(mode==="month")monthOffset+=dir;else weekOffset+=dir;render()});
}
document.getElementById("prev").onclick=()=>go(-1);

(()=>{
  const area=document.querySelector(".wrap"),pane=document.getElementById("pane");
  let x0=null,y0=0,dx=0,axis=null,t0=0;
  area.addEventListener("touchstart",e=>{
    if(e.touches.length!==1||mode==="tpl"||busy||document.querySelector("dialog[open]")){x0=null;return}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;axis=null;t0=performance.now();pane.style.transition="none";
  },{passive:true});
  area.addEventListener("touchmove",e=>{
    if(x0===null)return;
    const x=e.touches[0].clientX-x0,y=e.touches[0].clientY-y0;
    if(!axis&&(Math.abs(x)>8||Math.abs(y)>8))axis=Math.abs(x)>Math.abs(y)*1.2?"x":"y";
    if(axis!=="x")return;
    const i=TABS.indexOf(mode)+(x<0?1:-1),edge=i<0||i>=TABS.length;
    dx=x;
    const off=edge?x*.18:x*.55;
    pane.style.transform="translateX("+off+"px)";
    pane.style.opacity=String(1-Math.min(.35,Math.abs(off)/700));
  },{passive:true});
  const end=()=>{
    if(x0===null)return;x0=null;
    if(axis!=="x"){pane.style.transition="";return}
    const v=Math.abs(dx)/Math.max(1,performance.now()-t0);
    const i=TABS.indexOf(mode)+(dx<0?1:-1);
    if((Math.abs(dx)>70||(v>.45&&Math.abs(dx)>30))&&i>=0&&i<TABS.length){pane.style.transition="";switchTab(TABS[i])}
    else{pane.style.transition="transform .38s cubic-bezier(.2,.9,.3,1.25),opacity .3s";pane.style.transform="";pane.style.opacity="";setTimeout(()=>{pane.style.transition=""},400)}
  };
  area.addEventListener("touchend",end,{passive:true});
  area.addEventListener("touchcancel",end,{passive:true});
})();
function todayLine(){
  const list=weekDays()[(new Date().getDay()+6)%7];
  if(!list.length)return "Aujourd’hui : repos";
  const left=list.filter(s=>!s.done);
  if(!left.length)return "Aujourd’hui : fait ✓";
  return "Aujourd’hui : "+left.map(s=>s.title+(s.type==="run"&&s.km?" "+String(s.km).replace(".",",")+" km":"")).join(" + ");
}
function streak(){
  const d=mondayOf(new Date());
  if(!isPerfect(d))d.setDate(d.getDate()-7);
  let n=0;while(isPerfect(d)){n++;d.setDate(d.getDate()-7)}
  return n;
}

function badgeStats(){

  const keys=Object.keys(state.weeks).sort();
  let run=0,prev=null;
  keys.forEach(k=>{
    const all=state.weeks[k].flat();
    all.forEach(s=>{if(!s.done)return;r.sess++;

    const [y,mo,da]=k.split("-").map(Number);const mon=new Date(y,mo-1,da);
    const perfect=all.length>0&&all.every(s=>s.done);
    if(perfect){r.pw++;const consec=prev&&Math.round((mon-prev)/864e5)===7;run=consec?run+1:1;if(run>r.streak)r.streak=run}else run=0;
    prev=perfect?mon:null;
  });
  if(keys.length){const [y,mo]=keys[0].split("-").map(Number);const now=new Date();
    for(let d=new Date(y,mo-1,1);d<=now;d.setMonth(d.getMonth()+1))if(isMonthPerfect(d.getFullYear(),d.getMonth()))r.pm++}
  r.km=Math.round(r.km*10)/10;
  return r;
}
function badgeLevels(){const st=badgeStats();return BADGES.map(b=>b.steps.filter(x=>st[b.id]>=x).length)}

const fmtN=n=>(Math.round(n*10)/10).toLocaleString("fr-FR",{maximumFractionDigits:1});
function fmtDur(min){min=Math.round(min);const hh=Math.floor(min/60),mm=min%60;return hh?hh+" h"+(mm?" "+String(mm).padStart(2,"0"):""):mm+" min"}
function renderStats(){
  const N=12,today=new Date();today.setHours(0,0,0,0);
  const cur=mondayOf(today),weeks=[];let pk=0,pm=0,bestPace=0;
  for(let k=N-1;k>=0;k--){
    const mon=new Date(cur);mon.setDate(cur.getDate()-7*k);
    const w=state.weeks[keyOf(mon)];
    let km=0,done=0,planned=0,min=0,run=0,renfo=0;
    if(w)w.forEach((list,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);
      list.forEach(s=>{if(d<=today)planned++;if(!s.done)return;done++;min+=minOf(s);
        if(s.type==="run"){run++;km+=kmOf(s);if(s.akm!=null&&s.amin){pk+=+s.akm;pm+=+s.amin;if(s.akm>=3){const pace=s.amin/s.akm;if(!bestPace||pace<bestPace)bestPace=pace}}}else renfo++})});
    weeks.push({mon,km,done,planned,min,run,renfo,exists:!!w,perfect:isPerfect(mon)});
  }
  const sum=f=>weeks.reduce((a,w)=>a+f(w),0);
  const totKm=sum(w=>w.km),totDone=sum(w=>w.done),totPlan=sum(w=>w.exists?w.planned:0),totMin=sum(w=>w.min);
  const runs=sum(w=>w.run),renfos=sum(w=>w.renfo);
  const last4=weeks.slice(-5,-1),avg4=last4.reduce((a,w)=>a+w.km,0)/4;
  const prev4=weeks.slice(-9,-5),avgP=prev4.reduce((a,w)=>a+w.km,0)/4;
  const maxKm=Math.max(1,...weeks.map(w=>w.km));
  const all=badgeStats();
  const allMin=Object.values(state.weeks).reduce((a,w)=>a+w.flat().reduce((b,s)=>b+(s.done?minOf(s):0),0),0);
  let best=0;Object.values(state.weeks).forEach(w=>{const k=w.flat().reduce((a,s)=>a+(s.done&&s.type==="run"?kmOf(s):0),0);if(k>best)best=k});

  document.getElementById("range").textContent="Stats";
  document.getElementById("sub").textContent="Tes 12 dernières semaines";
  const summary=document.getElementById("summary");summary.replaceChildren();
  const tr=el("div",{class:"track month","aria-hidden":"true"});
  weeks.forEach(w=>{const s=el("span",{class:w.perfect?"gold":""});s.append(el("i",{style:"width:"+Math.round(w.km/maxKm*100)+"%"}));tr.append(s)});
  const sts=el("div",{class:"stats"});
  sts.innerHTML=`<span><b>${fmtN(totKm)}</b> km courus</span><span><b>${totDone}</b> séances</span>`;
  summary.append(tr,sts);

  const box=el("div",{class:"statsv"});
  // Graphique
  const W=340,H=150,top=22,bot=22,gap=6,bw=(W-gap*(N-1))/N;
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Kilomètres par semaine sur 12 semaines">`;
  [0.5,1].forEach(f=>{const y=top+(H-top-bot)*(1-f);svg+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="grid"/>`});
  weeks.forEach((w,i)=>{
    const bh=Math.max(w.km?4:2,(H-top-bot)*w.km/maxKm),x=i*(bw+gap),y=H-bot-bh;
    const isCur=i===N-1,cls=w.perfect?"bar gold":isCur?"bar cur":"bar";
    svg+=`<rect class="${cls}" style="--i:${i}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4"/>`;
    if((isCur||w.km===maxKm)&&w.km)svg+=`<text class="val" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${fmtN(w.km)}</text>`;
    if(i%3===2||isCur)svg+=`<text class="lab" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${isCur?"Cette sem.":w.mon.getDate()+" "+MONTHS[w.mon.getMonth()]}</text>`;
  });
  svg+=`</svg>`;
  const chart=el("section",{class:"card"});
  const trend=avgP?Math.round((avg4-avgP)/avgP*100):null;
  chart.innerHTML=`<div class="card-h"><span>Km par semaine</span>${trend===null?"":`<span class="trend ${trend>=0?"up":"down"}">${trend>=0?"▲":"▼"} ${Math.abs(trend)} %</span>`}</div>${svg}`;
  box.append(chart);
  // Chiffres clés
  const reg=totPlan?Math.round(totDone/totPlan*100):0;
  const tiles=[["Total",fmtN(all.km)+" km","courus depuis le début"],["Régularité",reg+" %","séances prévues faites"],["Plus longue",fmtN(all.long)+" km","sortie record"],["Meilleure semaine",fmtN(best)+" km","ton record hebdo"],["Temps total",fmtDur(allMin),"d’entraînement depuis le début"],["Semaines parfaites",String(weeks.filter(w=>w.perfect).length),"sur les 12 dernières"],["Allure moyenne",pk?fmtPace(pk,pm)+" /km":"–","sur tes courses saisies"],["Meilleure allure",bestPace?fmtPace(1,bestPace)+" /km":"–","sortie de 3 km ou plus"]];
  const grid=el("div",{class:"tiles"});
  tiles.forEach(([a,b,c],i)=>{const t=el("div",{class:"tile",style:"--i:"+i});t.append(el("span",{class:"t-l"},a),el("span",{class:"t-v"},b),el("span",{class:"t-s"},c));grid.append(t)});
  box.append(grid);
  // Répartition
  const tot=runs+renfos,rp=tot?Math.round(runs/tot*100):50;
  const split=el("section",{class:"card"});
  split.innerHTML=`<div class="card-h"><span>Répartition</span><span class="muted">${tot} séances</span></div>
    <div class="split" role="img" aria-label="${runs} courses et ${renfos} renforcements"><i class="r" style="width:${tot?rp:50}%"></i><i class="f" style="width:${tot?100-rp:50}%"></i></div>
    <div class="split-l"><span><i class="dot run ok"></i>Course · ${runs}</span><span><i class="dot renfo ok"></i>Renfo · ${renfos}</span></div>`;
  box.append(split);
  const daysEl=document.getElementById("days");daysEl.className="";daysEl.replaceChildren(box);
  document.getElementById("footer").replaceChildren();
}
function renderBadges(){
  const st=badgeStats(),lv=badgeLevels();
  const tot=lv.reduce((a,b)=>a+b,0),max=BADGES.length*5;
  document.getElementById("range").textContent="Badges";
  document.getElementById("sub").textContent=tot?tot+" niveau"+(tot>1?"x":"")+" débloqué"+(tot>1?"s":"")+" sur "+max:"Coche tes séances pour débloquer tes premiers badges";

    info.append(top,bar,foot);

    row.append(medal,info);list.append(row);
  });
  const daysEl=document.getElementById("days");daysEl.className="";daysEl.replaceChildren(list);
  document.getElementById("footer").replaceChildren();
}
function isMonthPerfect(y,m){
  let t=0;
  for(let d=new Date(y,m,1);d.getMonth()===m;d.setDate(d.getDate()+1)){
    for(const s of sessionsOn(d)){t++;if(!s.done)return false}
  }
  return t>0;
}
function burst(cv,origins,count,dur,cols){
  const dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const ps=[];origins.forEach(o=>{for(let i=0;i<count;i++){const a=o.angle+(Math.random()-.5)*o.spread,v=Math.random()*o.power+o.power*.5;
    ps.push({x:o.x*W,y:o.y*H,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:Math.random()*7+5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],round:Math.random()<.35,delay:o.delay||0})}});
  const t0=performance.now();
  return new Promise(res=>{(function f(t){const el_=t-t0,k=el_/dur;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{if(el_<p.delay)return;p.vy+=.25;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.globalAlpha=Math.max(0,1-k*k*k);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.s/2.4,0,7);ctx.fill()}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(k<1)requestAnimationFrame(f);else res()})(t0)});
}

// Sauvegarde : base de données de l’artifact si disponible, sinon ce navigateur
const LS="planning-course-v1";
let dbDoc=null,saveTimer=null,ready=false;
function toast(t){const s=document.getElementById("saveState");s.textContent=t;s.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>s.classList.remove("show"),1400)}
function queueSave(show){
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(!ready)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(!dbDoc){if(show)toast("Enregistré sur cet appareil");return}
    try{await dbDoc.set({json:JSON.stringify(state),updated:Date.now()});if(show)toast("Enregistré")}
    catch(e){toast("Échec de l’enregistrement, réessaie dans un instant")}
  },600);
}
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const s=JSON.parse(raw);if(s&&s.template)state=s}}catch(e){}}

(async()=>{
  try{
    if(window.claude&&claude.use){
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      const id=user?await user.id():null;
      if(db&&id){
        dbDoc=db.collection("data/users/"+id).doc("planning");
        const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000));
        const snap=await Promise.race([dbDoc.get(),timeout]);
        if(snap.exists){const s=JSON.parse(snap.data().json);if(s&&s.template){state=s;render()}}
        ready=true;
        if(!snap.exists)queueSave(false);
        return;
      }
    }
  }catch(e){dbDoc=null}
  ready=true;
})();
